  <style>

      min-height: 100vh;
    }
    .card {
      max-width: 36rem;

      box-shadow: 0 10px 40px rgba(78, 52, 46, 0.12);

      border-radius: 4px;
      font-family: 'JetBrains Mono', 'SFMono-Regular', Consolas, monospace;
      font-size: 0.92em;

</head>
<body>
  <main class="card">
    <h1>This project was renamed.</h1>

      (<a href="https://pypi.org/project/pysr3/">PySR3</a>, sparse regression
      by Sholokhov).
    </p>
