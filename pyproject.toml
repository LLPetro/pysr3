[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "pysr3"
version = "0.1.0"
description = "Third-party reader and visualizer for CMG SR3 files"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "pysr3 contributors" }]
keywords = ["CMG", "SR3", "reservoir", "grid", "pyvista", "visualization"]
dependencies = [
    "numpy>=1.21",
    "h5py>=3.0",
    "pyvista>=0.40",
    "pandas>=1.3",
]

[project.optional-dependencies]
dev = ["pytest>=7"]
docs = ["mkdocs-material>=9.5", "mkdocstrings[python]>=0.24", "mkdocs-static-i18n>=1.2", "black>=24.0"]

[tool.setuptools]
packages = ["pysr3", "pysr3.grid"]

[tool.pytest.ini_options]
testpaths = ["test"]
addopts = "-q"
