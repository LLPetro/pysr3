site_name: pysr3
site_description: A third-party Python reader, grid builder, and property mapper for CMG SR3 files
site_url: https://LLPetro.github.io/pysr3/
use_directory_urls: false
copyright: Copyright &copy; pysr3 contributors

theme:
  name: material
  language: en
  logo: assets/images/favicon.png
  favicon: assets/images/favicon.png
  icon:
    repo: fontawesome/brands/github
  font:
    text: Plus Jakarta Sans
    code: JetBrains Mono
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: orange
      accent: deep orange
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: orange
      accent: deep orange
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
    - content.tabs.link

extra_css:
  - stylesheets/extra.css

plugins:
  - search
  - autorefs:
      resolve_closest: true
  - i18n:
      docs_structure: suffix
      fallback_to_default: true
      reconfigure_material: true
      reconfigure_search: true
      languages:
        - locale: en
          default: true
          name: English
          build: true
        - locale: zh
          name: 简体中文
          build: true
          nav_translations:
            Home: 首页
            User Guide: 用户指南
            Developer Guide: 开发者指南
            API Reference: API 参考
            Installation: 安装
            Quickstart: 快速开始
            Building grids: 构建网格
            Concepts: 概念
            Grid types: 网格类型
            Coordinate system: 坐标系统
            DFN vs LGR: DFN 与 LGR
            Wells & time series: 井与时序
            Tutorials: 教程
            First SR3 case: 第一个 SR3 案例
            Grid visualization: 网格可视化
            Corner-point grids: 角点网格
            Well time series: 井与时序结果
            "In-depth: HM model": 深入：HM 模型
            Examples: 示例
            Grid cases: 网格示例
            Time-series examples: 时序示例
            Overview: 总览
            Architecture: 架构
            Data model & types: 数据模型与类型
            Component relationships: 组件关系
            Grid strategy internals: 网格策略内部实现
            Testing & validation: 测试与核验
            Contributing: 贡献指南
            Grid geometry helpers: 网格几何工具
  - mkdocstrings:
      default_handler: python
      handlers:
        python:
          paths: [.]
          options:
            docstring_style: google
            docstring_section_style: table
            show_root_heading: true
            show_root_full_path: false
            show_symbol_type_heading: true
            show_symbol_type_toc: true
            show_source: true
            members_order: source
            separate_signature: true
            show_signature_annotations: true
            signature_crossrefs: true
            merge_init_into_class: true
            filters: ["!^_"]

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - footnotes
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

nav:
  - Home: index.md
  - User Guide:
      - user-guide/index.md
      - Installation: user-guide/installation.md
      - Quickstart: user-guide/quickstart.md
      - Building grids: user-guide/grid-building.md
      - Concepts:
          - Grid types: user-guide/concepts/grid-types.md
          - Coordinate system: user-guide/concepts/coordinate-system.md
          - DFN vs LGR: user-guide/concepts/dfn-vs-lgr.md
          - Wells & time series: user-guide/concepts/timeseries.md
          - Units & conversion: user-guide/concepts/units.md
          - Volumes & weighting: user-guide/concepts/volumes.md
      - Tutorials:
          - user-guide/tutorials/index.md
          - First SR3 case: user-guide/tutorials/first-sr3-case.md
          - Grid visualization: user-guide/tutorials/grid-visualization.md
          - Corner-point grids: user-guide/tutorials/corner-grid.md
          - Well time series: user-guide/tutorials/well-timeseries.md
          - "In-depth: HM model": user-guide/tutorials/inspect-hm-model.md
      - Examples:
          - Grid cases: user-guide/examples/grid-cases.md
          - Time-series examples: user-guide/examples/timeseries.md
  - Developer Guide:
      - developer-guide/index.md
      - Architecture: developer-guide/architecture.md
      - Data model & types: developer-guide/data-model.md
      - Component relationships: developer-guide/components.md
      - Grid strategy internals: developer-guide/grid-internals.md
      - Testing & validation: developer-guide/testing.md
      - Contributing: developer-guide/contributing.md
  - API Reference:
      - api/index.md
      - SR3Indexer: api/indexer.md
      - GridBuilder: api/grid-builder.md
      - DataMapper: api/data-mapper.md
      - Grid geometry helpers: api/grid-geometry.md
